# Rebuild the search index behind the L4 Commons MCP server
# (https://commons.utility.workers.dev/mcp) whenever main changes.
#
# .github/mcp-index/build-index.mjs reads subjects/ and writes one SQL file;
# wrangler loads it into the server's Cloudflare D1 database, replacing the
# previous index. The server reads files from GitHub at the commit recorded in
# the index, so it always matches the line numbers it hands out.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with Account › D1 › Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that holds the l4-commons-index database

name: mcp-index

on:
  push:
    branches: [main]
    paths:
      - 'subjects/**'
      - '.github/mcp-index/**'
      - '.github/workflows/mcp-index.yml'
  workflow_dispatch:

# One load at a time; a push that lands mid-run queues behind it, and a newer
# push replaces any run still waiting.
concurrency:
  group: mcp-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the index
        run: node .github/mcp-index/build-index.mjs . "$RUNNER_TEMP/index.sql"

      - name: Load it into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx --yes wrangler@4.163.0 d1 execute l4-commons-index --remote --file "$RUNNER_TEMP/index.sql" --yes
