# Keep the search index behind the L4 Commons MCP server
# (https://commons.utility.workers.dev/mcp) in step with main.
#
# Incremental: .github/mcp-index/build-index.mjs compares a hash of each law's
# rows with the hashes the database holds (law_state) and writes only the laws
# that changed. It keeps to a daily budget of D1 rows written (the free plan
# allows 100,000 a day per account); changes that don't fit wait for the next
# run, and the daily scheduled run picks them up after D1's counter resets at
# midnight UTC.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with Account › D1 › Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that holds the l4-commons-index database
# and takes its budget from the MCP_INDEX_DAILY_WRITES repository variable
# (default 50000), or the `budget` input when run by hand.

name: mcp-index

on:
  push:
    branches: [main]
    paths:
      - 'subjects/**'
      - '.github/mcp-index/**'
      - '.github/workflows/mcp-index.yml'
  schedule:
    - cron: '30 0 * * *' # just after D1's daily counter resets
  workflow_dispatch:
    inputs:
      budget:
        description: 'D1 rows this run may bring today’s total up to (default: MCP_INDEX_DAILY_WRITES, or 50000)'
        required: false

# One sync at a time, each reading the state the previous one left; a newer
# trigger replaces any run still waiting.
concurrency:
  group: mcp-index
  cancel-in-progress: false

permissions:
  contents: read

env:
  DB: l4-commons-index
  WRANGLER: npx --yes wrangler@4.163.0
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BUDGET: ${{ inputs.budget || vars.MCP_INDEX_DAILY_WRITES || '50000' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read what the index holds
        run: |
          $WRANGLER d1 execute "$DB" --remote --json \
            --command "SELECT id, hash, commit_sha, writes FROM law_state; SELECT key, value FROM meta" \
            > "$RUNNER_TEMP/state.json"

      - name: Work out what changed
        id: plan
        run: node .github/mcp-index/build-index.mjs . "$RUNNER_TEMP/changes.sql" --sync "$RUNNER_TEMP/state.json" --budget "$BUDGET"

      - name: Write the changes
        if: steps.plan.outputs.load == 'true'
        run: $WRANGLER d1 execute "$DB" --remote --file "$RUNNER_TEMP/changes.sql" --yes
